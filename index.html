<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Unique App UI</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #466cff;
      --accent: #ff6384;
      --background: #f6f8fa;
      --card-bg: #fff;
      --shadow: 0 4px 24px rgba(70,108,255,0.09);
      --radius: 24px;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(120deg, var(--primary) 0%, var(--accent) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-bar {
      width: 100vw;
      max-width: 480px;
      padding: 1rem 1.2rem;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: 0 2px 12px rgba(70,108,255,0.075);
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .app-title {
      font-size: 2rem;
      color: var(--primary);
      font-weight: 700;
      margin: 0;
    }
    .avatar {
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(70, 108, 255, 0.2);
    }
    .main-card {
      margin: 2rem 0;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 90vw;
      max-width: 420px;
      padding: 2rem 1.5rem;
      text-align: center;
      position:relative;
      z-index: 1;
    }
    .main-card h2 {
      color: var(--primary);
      font-weight: 700;
      margin-top: 0;
    }
    .main-card p {
      color: #444;
      font-size: 1.08rem;
      margin-bottom: 0;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 480px;
      background: rgba(255,255,255,0.87);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 1rem 0 0.4rem 0;
      box-shadow: 0 -2px 12px rgba(70,108,255,0.09);
      border-radius: var(--radius) var(--radius) 0 0;
      z-index: 10;
    }
    .nav-item {
      color: var(--primary);
      font-size: 1.5rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      padding: 0.2rem 0.8rem;
      transition: color 0.19s;
      border-radius: 12px;
    }
    .nav-item.active,
    .nav-item:hover {
      color: var(--accent);
      background: rgba(70,108,255,0.07);
    }
    @media (max-width: 600px) {
      .app-bar,
      .bottom-nav {
        border-radius: 0;
        max-width: 100vw;
        padding-left: 1vw;
        padding-right: 1vw;
      }
      .main-card {
        width: 98vw;
        max-width: none;
        padding: 1.2rem 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-bar">
    <h1 class="app-title">My Unique App</h1>
    <img class="avatar" src="https://ui-avatars.com/api/?name=User&background=466cff&color=fff" alt="avatar" width="40" height="40">
  </div>
  <div class="main-card">
    <h2>Welcome!</h2>
    <p>
      Enjoy a modern, glass-inspired UI.<br>
      Try swiping, tap the bottom nav, and explore.
    </p>
  </div>
  <div class="bottom-nav">
    <div class="nav-item active">🏠 Home</div>
    <div class="nav-item">🔍 Search</div>
    <div class="nav-item">⚙️ Profile</div>
  </div>
</body>
</html>
